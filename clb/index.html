<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icon.svg" />
  <link rel="preload" as="image" href="posters/1.webp" />
  <link rel="preload" as="image" href="assets/ch-logo.svg" />
  <title>Sổ CLB số — CaritaHub</title>
  <style>
    :root{
      --slide-seconds:8; --fade-ms:900;
      --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.09);
      --bg:#fbfbfd; --card:#ffffff; --surface:#f5f5f7;
      --brand:#1d1d1f; --brand2:#2f6df6; --accent:#2f6df6;
      --shadow:0 4px 18px rgba(0,0,0,.05); --shadow-lg:0 20px 54px rgba(0,0,0,.10);
      --r:22px;
      --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    html,body{overscroll-behavior:none}
    body{font-family:var(--font);color:var(--ink);background:var(--bg);
      -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
      -webkit-user-select:none;user-select:none;overflow:hidden}
    img{-webkit-user-drag:none;user-drag:none}
    a{color:inherit;text-decoration:none}

    /* ===== TOP OVERLAY (expand) ===== */
    /* control panel — anchored at the BOTTOM (above the floating nav) to avoid device status/nav bars */
    .topbar{position:fixed;left:50%;bottom:max(78px,calc(env(safe-area-inset-bottom) + 72px));z-index:80;
      width:min(560px,94vw);
      background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 16px 46px rgba(20,18,45,.22);
      transform:translateX(-50%) translateY(170%);transition:transform .34s cubic-bezier(.4,0,.2,1)}
    body.nav-open .topbar{transform:translateX(-50%) translateY(0)}
    .tbrow{min-height:52px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;padding:10px 14px}
    .brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px;white-space:nowrap}
    .brand b{color:var(--brand2)}.brand .dot{color:var(--muted);font-weight:600;font-size:11.5px}
    .tbrow .spacer{display:none}
    .iconbtn{appearance:none;border:1px solid var(--line);background:#fff;cursor:pointer;width:36px;height:36px;
      border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:0 0 auto}
    .iconbtn:hover{background:#faf8f2}.iconbtn svg{width:18px;height:18px}

    /* ===== FLOATING BOTTOM-RIGHT NAV ===== */
    .fab{position:fixed;right:max(14px,calc(env(safe-area-inset-right) + 8px));
      bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));z-index:90;
      display:flex;align-items:center;gap:3px;padding:5px;border-radius:999px;
      background:rgba(22,20,42,.52);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,.22);box-shadow:0 10px 34px rgba(0,0,0,.32);transition:opacity .35s}
    .fab .ftab{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:13.5px;
      color:rgba(255,255,255,.86);padding:8px 18px;border-radius:999px;transition:.2s;white-space:nowrap}
    .fab .ftab.active{background:#fff;color:var(--brand)}
    .fab .fdiv{width:1px;height:20px;background:rgba(255,255,255,.24);margin:0 2px}
    .fab .fexp{appearance:none;border:0;cursor:pointer;background:transparent;color:#fff;width:36px;height:36px;
      border-radius:999px;display:flex;align-items:center;justify-content:center}
    .fab .fexp:hover{background:rgba(255,255,255,.16)}
    .fab .fexp svg{width:20px;height:20px;transition:transform .3s}
    body.nav-open .fab .fexp svg{transform:rotate(180deg)}
    body.pidle.mode-poster .fab{opacity:.28}
    .sndbtn{position:fixed;left:max(14px,calc(env(safe-area-inset-left) + 8px));bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));z-index:90;
      width:46px;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;
      background:rgba(22,20,42,.52);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,.22);box-shadow:0 10px 34px rgba(0,0,0,.32);color:#fff;cursor:pointer;transition:opacity .35s}
    .sndbtn svg{width:22px;height:22px}
    body.mode-app .sndbtn{display:none}
    body.pidle.mode-poster .sndbtn{opacity:.28}
    @media (min-width:900px){.sndbtn{width:54px;height:54px}.sndbtn svg{width:26px;height:26px}}

    .view{display:none}.view.active{display:block}

    /* ===== POSTER ===== */
    #stage{position:fixed;inset:0;z-index:10;overflow:hidden;cursor:pointer;
      background:radial-gradient(130% 100% at 50% 0%,#26262a 0%,#151517 46%,#000 100%);
      display:flex;align-items:center;justify-content:center}
    .slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;will-change:opacity;
      transition:opacity calc(var(--fade-ms)*1ms) ease-in-out;pointer-events:none;padding:clamp(8px,2.5vmin,40px)}
    .slide.active{opacity:1}
    .slide img{max-width:100%;max-height:100%;object-fit:contain;border-radius:clamp(4px,1.2vmin,14px);box-shadow:0 30px 80px rgba(0,0,0,.55)}
    /* fill-screen — blurred backdrop: poster stays undistorted, background filled with a soft blurred copy of itself */
    .slide-bg{position:absolute;inset:-12%;z-index:0;background-size:cover;background-position:center;
      filter:blur(42px) saturate(1.18) brightness(.62);transform:scale(1.16);opacity:0;transition:opacity .7s ease;pointer-events:none;will-change:opacity}
    .slide img{position:relative;z-index:1}
    body.poster-fill .slide.active .slide-bg{opacity:1}
    #bar{position:absolute;top:0;left:0;height:3px;width:0;z-index:20;background:linear-gradient(90deg,#0a84ff,#64a7ff);box-shadow:0 0 12px rgba(10,132,255,.5)}
    #dots{position:absolute;bottom:max(22px,calc(env(safe-area-inset-bottom) + 16px));left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:20;transition:opacity .4s}
    .dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:.3s}
    .dot.active{background:#fff;transform:scale(1.25)}
    body.pidle #dots{opacity:0;pointer-events:none}
    #holdhint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:25;display:flex;align-items:center;gap:10px;
      padding:12px 20px;border-radius:14px;background:rgba(10,8,26,.62);backdrop-filter:blur(6px);color:#fff;font-weight:700;font-size:15px;
      opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
    body.holding #holdhint{opacity:1;transform:translate(-50%,-50%) scale(1)}
    #holdhint svg{width:18px;height:18px}

    /* ===== APP DECK (kiosk step-by-step) ===== */
    #view-app.active{position:fixed;inset:0;z-index:10;background:#fbfbfd;overflow:hidden}
    #deck{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      overflow:auto;touch-action:pan-y;padding:clamp(56px,7vh,84px) clamp(64px,9vw,120px);perspective:1800px;perspective-origin:center}
    .step{width:100%;max-width:1120px;margin:auto;opacity:0;transform:translateY(10px);will-change:opacity,transform;backface-visibility:hidden;transform-style:preserve-3d;
      transition:opacity .5s ease,transform .55s cubic-bezier(.33,0,.2,1)}
    /* page-turn / paper-fold: new page swings in from its leading edge */
    .step.from-r{transform-origin:right center;transform:rotateY(-28deg) translateX(52px) scale(.985)}
    .step.from-l{transform-origin:left center;transform:rotateY(28deg) translateX(-52px) scale(.985)}
    .step.in{opacity:1;transform:none!important}
    @media (prefers-reduced-motion: reduce){.step.from-r,.step.from-l{transform:none}}

    /* intro */
    .ch-logo{height:clamp(38px,5.2vh,56px);display:block;margin:0 auto 22px;width:auto;max-width:min(80vw,340px)}
    .step-screen .txt{max-width:min(460px,100%)}
    .step-intro{text-align:center}
    .step-intro .eyebrow{font-size:clamp(12px,1.5vw,14px);font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--brand2)}
    .step-intro h1{font-size:clamp(30px,6vw,58px);color:var(--brand);letter-spacing:-.025em;line-height:1.05;margin-top:14px}
    .step-intro p{max-width:680px;margin:18px auto 0;color:#4b5563;font-size:clamp(15px,2vw,19px);line-height:1.6}
    .chan-cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}
    .chan-cards .cc{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
      border-radius:14px;padding:12px 16px;cursor:pointer;transition:.16s;font-weight:700;font-size:14.5px;color:var(--ink)}
    .chan-cards .cc:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.10)}
    .chan-cards .cc b{width:26px;height:26px;border-radius:8px;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}

    /* chapter */
    .step-chapter{text-align:center;position:relative}
    .step-chapter .big-no{position:absolute;top:-13vh;left:50%;transform:translateX(-50%);font-size:36vh;font-weight:800;
      color:#000;opacity:.028;line-height:1;pointer-events:none;z-index:0}
    .step-chapter>*{position:relative;z-index:1}
    .kick{display:inline-flex;align-items:center;gap:9px;justify-content:center}
    .kick i{width:10px;height:10px;border-radius:50%;background:var(--ch,#4b47c9)}
    .kick span{font-size:clamp(12px,1.5vw,14px);font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--ch,#4b47c9)}
    .step-chapter h1{font-size:clamp(26px,4.6vw,46px);color:var(--brand);letter-spacing:-.02em;line-height:1.1;margin:16px auto 0;max-width:900px}
    .badge{display:inline-block;font-size:12px;font-weight:800;padding:5px 13px;border-radius:999px;margin-top:16px}
    .badge.live{background:#dcfce7;color:#15803d}.badge.proto{background:#fef3c7;color:#b45309}
    .step-chapter .blurb{max-width:760px;margin:18px auto 0;color:#4b5563;font-size:clamp(15px,1.9vw,18px);line-height:1.6}
    .feats{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:22px auto 0;max-width:820px;padding:0}
    .feats li{list-style:none;font-size:13px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid transparent;
      border-radius:999px;padding:7px 14px;display:flex;align-items:center;gap:8px}
    .feats li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ch,#4b47c9)}
    .manual{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-weight:700;font-size:14px;color:var(--brand2);
      background:#eef3ff;border:1px solid #dbe6ff;padding:10px 16px;border-radius:12px;transition:.15s}
    .manual:hover{background:#e2ecff}
    .go-hint{margin-top:24px;color:var(--muted);font-size:13.5px;font-weight:600}

    /* screen */
    .step-screen{display:flex;flex-wrap:wrap;gap:clamp(20px,4.5vw,60px);align-items:center;justify-content:center}
    .step-screen .dev{flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
    .step-screen .txt{flex:1 1 300px;max-width:460px;min-width:260px}
    .step-screen .chan{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ch,#4b47c9)}
    .step-screen .chan i{width:8px;height:8px;border-radius:50%;background:var(--ch,#4b47c9)}
    .step-screen h2{font-size:clamp(22px,3.2vw,34px);color:var(--brand);letter-spacing:-.02em;line-height:1.16;margin:12px 0 0}
    .step-screen .detail{margin-top:14px;color:#4b5563;font-size:clamp(15px,1.9vw,18px);line-height:1.6}
    .step-screen .zoom{margin-top:18px;display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;font-weight:600}
    @media (orientation:portrait){.step-screen{flex-direction:column}.step-screen .txt{text-align:center;max-width:640px}.step-screen .chan{justify-content:center}}

    /* device frames */
    .phone{background:#1d1d1f;border-radius:34px;padding:10px;box-shadow:var(--shadow-lg);position:relative;width:min(300px,34vh,82vw)}
    .phone::before{content:"";position:absolute;top:17px;left:50%;transform:translateX(-50%);width:34%;height:6px;background:#26282e;border-radius:99px;z-index:2}
    .phone .screen{border-radius:24px;overflow:hidden;aspect-ratio:640/1385;background:#fff;display:block}
    .phone .screen img{width:100%;height:100%;object-fit:cover;display:block}
    .browser{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-lg);width:min(820px,54vw,124vh)}
    .browser .b-bar{height:36px;display:flex;align-items:center;gap:7px;padding:0 14px;background:#f5f5f7;border-bottom:1px solid var(--line)}
    .browser .b-bar i{width:12px;height:12px;border-radius:50%;display:block}
    .browser .b-bar .r{background:#ff5f57}.browser .b-bar .y{background:#febc2e}.browser .b-bar .g{background:#28c840}
    .browser .b-bar .addr{flex:1;height:20px;margin-left:8px;background:#fff;border:1px solid #e3ded3;border-radius:6px;font-size:11.5px;color:#9aa0ab;display:flex;align-items:center;padding:0 10px;overflow:hidden;white-space:nowrap}
    .browser .screen{aspect-ratio:1600/1000;background:#fff;display:block}
    .browser .screen img{width:100%;height:100%;object-fit:cover;display:block}
    .kiosk{background:#1d1d1f;border-radius:22px;padding:15px;box-shadow:var(--shadow-lg);width:min(760px,52vw,120vh)}
    .kiosk .screen{border-radius:9px;overflow:hidden;aspect-ratio:1600/1000;background:#fff;display:block}
    .kiosk .screen img{width:100%;height:100%;object-fit:cover;display:block}
    .kiosk .stand{width:74px;height:11px;background:#14161c;border-radius:0 0 9px 9px;margin:0 auto}

    /* links (print / manuals) */
    .step-links{text-align:center}
    .step-links h1{font-size:clamp(24px,4vw,40px);color:var(--brand);letter-spacing:-.02em;margin:14px auto 0;max-width:820px;line-height:1.12}
    .step-links .blurb{max-width:680px;margin:16px auto 0;color:#4b5563;font-size:clamp(15px,1.8vw,17px);line-height:1.6}
    .linkgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));max-width:900px;margin:28px auto 0;text-align:left}
    .lcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;transition:.16s;display:block}
    .lcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.10)}
    .lcard .tag{font-size:11px;font-weight:800;letter-spacing:.06em;color:#b45309;background:#fef3c7;display:inline-block;padding:3px 9px;border-radius:6px}
    .lcard h4{font-size:15.5px;margin:12px 0 5px;color:var(--ink)}
    .lcard p{font-size:12.5px;color:var(--muted);line-height:1.45}

    /* closing */
    .step-closing{text-align:center}
    .step-closing h1{font-size:clamp(24px,4vw,42px);color:var(--brand);letter-spacing:-.02em;line-height:1.1}
    .plist{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));max-width:920px;margin:26px auto 0;text-align:left}
    .pitem{background:var(--surface);border:1px solid transparent;border-radius:18px;padding:22px}
    .pitem b{display:block;color:var(--brand2);font-size:14.5px;margin-bottom:6px}
    .pitem span{font-size:13px;color:#4b5563;line-height:1.55}
    .close-foot{margin-top:26px;color:var(--muted);font-size:13.5px;line-height:1.7}
    .close-foot .flogo{font-weight:800;color:var(--brand);font-size:16px}
    .close-foot .flogo b{color:var(--brand2)}
    .close-foot .flinks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
    .close-foot .flinks a{font-size:13px;font-weight:700;color:var(--brand2);background:#eef3ff;border:1px solid #dbe6ff;padding:8px 15px;border-radius:10px}

    /* deck controls */
    .dk-arw{position:fixed;top:50%;transform:translateY(-50%);z-index:60;width:clamp(48px,6vw,62px);height:clamp(48px,6vw,62px);
      border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
      display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(20,18,45,.14);color:var(--brand);transition:.16s}
    .dk-arw:hover{background:#fff;transform:translateY(-50%) scale(1.06)}
    .dk-arw:disabled{opacity:.28;cursor:default;transform:translateY(-50%)}
    .dk-arw svg{width:26px;height:26px}
    #dk-prev{left:max(14px,env(safe-area-inset-left))}#dk-next{right:max(14px,env(safe-area-inset-right))}
    #dk-ov{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:60;
      display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border:1px solid var(--line);
      border-radius:12px;padding:9px 15px;font-weight:700;font-size:13.5px;color:var(--brand);cursor:pointer;box-shadow:0 8px 24px rgba(20,18,45,.12)}
    #dk-ov:hover{background:#fff}#dk-ov svg{width:17px;height:17px}
    #dk-foot{position:fixed;left:0;right:0;bottom:0;z-index:55;pointer-events:none}
    #dk-bar{height:4px;width:0;background:linear-gradient(90deg,var(--brand2),#8f8bff);transition:width .35s ease}
    #dk-label{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--brand);
      background:rgba(255,255,255,.8);backdrop-filter:blur(6px);padding:6px 14px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
    body.mode-poster .dk-arw,body.mode-poster #dk-ov,body.mode-poster #dk-foot{display:none}

    /* overview overlay */
    #ov{position:fixed;inset:0;z-index:110;background:rgba(244,240,231,.97);backdrop-filter:blur(6px);display:none;
      flex-direction:column;padding:clamp(20px,5vh,50px) clamp(20px,6vw,80px);overflow:auto}
    #ov.open{display:flex}
    #ov h2{font-size:clamp(20px,3vw,28px);color:var(--brand);text-align:center;letter-spacing:-.02em}
    #ov .ov-x{position:absolute;top:18px;right:20px;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;
      display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font-size:26px}
    .ov-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));max-width:1000px;margin:26px auto 0;width:100%}
    .ov-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.16s;display:flex;gap:14px;align-items:center}
    .ov-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.10)}
    .ov-card b{width:38px;height:38px;border-radius:10px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    .ov-card h3{font-size:15.5px;color:var(--ink)}.ov-card span{font-size:12.5px;color:var(--muted)}

    /* ===== iMin Heron 1 & large touch kiosks (portrait 1080×1920) ===== */
    @media (min-width:900px){
      .step-intro h1{font-size:clamp(46px,6.4vw,74px)}
      .step-chapter h1{font-size:clamp(40px,5.2vw,60px)}
      .step-intro p,.step-chapter .blurb,.step-links .blurb{font-size:clamp(19px,2.1vw,23px);line-height:1.62}
      .step-screen h2{font-size:clamp(34px,4vw,48px)}
      .step-screen .detail{font-size:clamp(21px,2.3vw,27px)}
      .step-screen .chan{font-size:16px}
      .step-links h1,.step-closing h1{font-size:clamp(38px,5vw,56px)}
      .feats li{font-size:15.5px;padding:9px 18px}
      .badge{font-size:14px;padding:6px 15px}
      .manual{font-size:16px;padding:12px 20px}
      .go-hint{font-size:16px}
      .chan-cards .cc{font-size:17px;padding:15px 21px}
      .chan-cards .cc b{width:30px;height:30px;font-size:13px}
      .dk-arw{width:76px;height:76px}.dk-arw svg{width:32px;height:32px}
      #dk-ov{font-size:16px;padding:12px 20px}#dk-ov svg{width:20px;height:20px}
      #dk-label{font-size:16px;padding:9px 22px}
      .fab{padding:6px}.fab .ftab{font-size:16px;padding:12px 26px}.fab .fexp{width:42px;height:42px}
      .ov-card{padding:22px}.ov-card b{width:44px;height:44px;font-size:16px}
      .ov-card h3{font-size:17px}.ov-card span{font-size:13.5px}

    #offtoast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%) translateY(-140%);

  <script>

  const POSTERS=["posters/6.webp","posters/1.webp","posters/2.webp","posters/3.webp","posters/4.webp","posters/5.webp"];
  const stage=document.getElementById('stage'),dotsWrap=document.getElementById('dots'),bar=document.getElementById('bar');
  const SLIDE_MS=(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--slide-seconds'))||8)*1000;
  let pIdx=0,pPlaying=true,pTimer=null,pStart=0,pRAF=null,posterActive=true,pHold=false;
  const slides=POSTERS.map((src,i)=>{const w=document.createElement('div');w.className='slide';
    const bg=document.createElement('div');bg.className='slide-bg';bg.style.backgroundImage='url("'+src+'")';w.appendChild(bg);
    const img=new Image();img.src=src;img.alt='Poster '+(i+1);img.loading=i===0?'eager':'lazy';w.appendChild(img);stage.insertBefore(w,bar);
    const d=document.createElement('div');d.className='dot';d.onclick=ev=>{ev.stopPropagation();pGo(i);};dotsWrap.appendChild(d);return w;});
  const dots=[...dotsWrap.children];
  function pRender(){slides.forEach((s,i)=>s.classList.toggle('active',i===pIdx));dots.forEach((d,i)=>d.classList.toggle('active',i===pIdx));}
  function pGo(i){pIdx=(i+slides.length)%slides.length;pRender();pRestart();}
  const pNext=()=>pGo(pIdx+1),pPrev=()=>pGo(pIdx-1);
  function pTick(){if(!pPlaying||!posterActive||pHold)return;bar.style.width=Math.min(100,((performance.now()-pStart)/SLIDE_MS)*100)+'%';pRAF=requestAnimationFrame(pTick);}
  function pRestart(){clearTimeout(pTimer);cancelAnimationFrame(pRAF);bar.style.width='0%';if(!pPlaying||!posterActive||pHold)return;pStart=performance.now();pRAF=requestAnimationFrame(pTick);pTimer=setTimeout(pNext,SLIDE_MS);}
  function pStop(){clearTimeout(pTimer);cancelAnimationFrame(pRAF);}
  function holdStart(){if(!posterActive||pHold)return;pHold=true;pStop();document.body.classList.add('holding');}
  function holdEnd(){if(!pHold)return;pHold=false;document.body.classList.remove('holding');if(pPlaying&&posterActive)pRestart();}
  let gX=0,gT=0,gMoved=false,gId=null;
  stage.addEventListener('pointerdown',e=>{if(!posterActive)return;gId=e.pointerId;gX=e.clientX;gT=performance.now();gMoved=false;holdStart();});
  stage.addEventListener('pointermove',e=>{if(gId===null)return;if(Math.abs(e.clientX-gX)>10)gMoved=true;});
  function endG(e){if(gId===null)return;gId=null;const dt=performance.now()-gT,dx=(e.clientX||gX)-gX;holdEnd();
    if(gMoved&&Math.abs(dx)>45){dx<0?pNext():pPrev();return;}
    if(dt<260&&!gMoved){const w=innerWidth;if(e.clientX<w*0.32)pPrev();else if(e.clientX>w*0.68)pNext();}}
  stage.addEventListener('pointerup',endG);
  stage.addEventListener('pointercancel',()=>{gId=null;holdEnd();});
  stage.addEventListener('pointerleave',()=>{if(gId!==null){gId=null;holdEnd();}});
  pRender();pRestart();
  let idleT;function wake(){document.body.classList.remove('pidle');clearTimeout(idleT);idleT=setTimeout(()=>{if(posterActive&&!pHold)document.body.classList.add('pidle')},3500);}

  function renderDeck(){
    const s=STEPS[deckIdx];

    const el=deck.firstElementChild;if(el)el.classList.add(deckDir<0?'from-l':'from-r');

    const _in=()=>requestAnimationFrame(()=>el&&el.classList.add('in'));
    if(_im&&_im.decode){_im.decode().then(_in).catch(_in);}else _in();
    var nx=STEPS[deckIdx+1];if(nx&&nx.type==='screen'){var im=new Image();im.src='app/'+nx.file+'.webp';if(im.decode)im.decode().catch(()=>{});}
    if(s.type==='stats')animateStats();
    if(typeof updateHash==='function')updateHash();
    if(typeof deckSchedule==='function')deckSchedule();
    // wire interactions
    deck.querySelectorAll('[data-jump]').forEach(c=>c.onclick=()=>{const ch=CH.find(x=>{const sec=SECTIONS.find(y=>y.kick===x.name);return sec&&sec.id===c.dataset.jump;});if(ch)deckJump(ch.start);});
    const dev=deck.querySelector('[data-shot]');if(dev)dev.onclick=()=>lbOpen(+dev.dataset.shot);
    // progress + label
    dkBar.style.width=((deckIdx+1)/STEPS.length*100)+'%';
    dkLabel.textContent=s.type==='screen'?(cn(s.chapter,s.chId)+' · '+s.idx+'/'+s.len):cn(s.chapter,s.type==='chapter'?s.sec.id:null);
    dkPrev.disabled=deckIdx===0;dkNext.disabled=deckIdx===STEPS.length-1;
  }
  function deckGo(d){if(typeof hap==='function')hap();deckJump(deckIdx+d);}
  function deckJump(i){i=Math.max(0,Math.min(STEPS.length-1,i));deckDir=i<deckIdx?-1:1;deckIdx=i;renderDeck();}
  dkPrev.onclick=()=>deckGo(-1);dkNext.onclick=()=>deckGo(1);

  /* swipe on deck */
  let dX=null,dMoved=false;
  deck.addEventListener('pointerdown',e=>{dX=e.clientX;dMoved=false;});
  deck.addEventListener('pointermove',e=>{if(dX!==null&&Math.abs(e.clientX-dX)>10)dMoved=true;});
  deck.addEventListener('pointerup',e=>{if(dX===null)return;const dx=e.clientX-dX;dX=null;if(dMoved&&Math.abs(dx)>50)dx<0?deckGo(1):deckGo(-1);});

  /* ==================== OVERVIEW ==================== */
  const ov=document.getElementById('ov'),ovGrid=document.getElementById('ov-grid');
  function buildOverview(){ovGrid.innerHTML='';CH.forEach(ch=>{const card=document.createElement('div');card.className='ov-card';
    const count=STEPS.filter((s,i)=>{const nextStart=CH[CH.indexOf(ch)+1]?CH[CH.indexOf(ch)+1].start:STEPS.length;return i>ch.start&&i<nextStart&&s.type==='screen';}).length;
    const chid=(SECTIONS.find(x=>x.kick===ch.name)||{}).id;
    card.innerHTML='<b style="background:'+ch.accent+'">'+(ch.no||'•')+'</b><div><h3>'+cn(ch.name,chid)+'</h3><span>'+(count?count+' '+L('screens','screens'):L('section','section'))+'</span></div>';
    card.onclick=()=>{deckJump(ch.start);ov.classList.remove('open');};ovGrid.appendChild(card);});}
  document.getElementById('dk-ov').onclick=()=>ov.classList.add('open');
  document.getElementById('ov-x').onclick=()=>ov.classList.remove('open');
  ov.onclick=e=>{if(e.target===ov)ov.classList.remove('open');};

  /* ==================== LIGHTBOX ==================== */
  const lb=document.getElementById('lb'),lbImg=document.getElementById('lb-img'),lbCap=document.getElementById('lb-cap');
  let lbI=0;
  function lbShow(){const it=shots[lbI];lbImg.src=it.file;lbImg.alt=it.cap;lbCap.textContent=it.cap;}
  function lbOpen(i){lbI=i;lbShow();lb.classList.add('open');}
  function lbClose(){lb.classList.remove('open');}
  function lbGo(d){lbI=(lbI+d+shots.length)%shots.length;lbShow();}
  document.getElementById('lb-x').onclick=lbClose;
  document.getElementById('lb-prev').onclick=e=>{e.stopPropagation();lbGo(-1);};
  document.getElementById('lb-next').onclick=e=>{e.stopPropagation();lbGo(1);};
  lb.onclick=e=>{if(e.target===lb)lbClose();};

  /* ==================== TABS / NAV / KEYS ==================== */
  const views={poster:document.getElementById('view-poster'),app:document.getElementById('view-app')};
  function switchTab(name){
    document.querySelectorAll('.ftab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
    Object.entries(views).forEach(([k,v])=>v.classList.toggle('active',k===name));
    posterActive=(name==='poster');
    document.body.classList.toggle('mode-poster',posterActive);
    document.body.classList.toggle('mode-app',!posterActive);
    if(posterActive){pPlaying=true;pRestart();wake();}
    else{document.body.classList.remove('pidle');pStop();renderDeck();}
    if(typeof updateBGM==='function')updateBGM();
    if(typeof deckSchedule==='function')deckSchedule();
  }
  document.querySelectorAll('.ftab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));
  function setNav(open){document.body.classList.toggle('nav-open',open);}
  document.getElementById('fexp').onclick=()=>setNav(!document.body.classList.contains('nav-open'));
  document.getElementById('closeNav').onclick=()=>setNav(false);
  document.getElementById('fsBtn').onclick=()=>{const el=document.documentElement;
    if(!document.fullscreenElement&&!document.webkitFullscreenElement)(el.requestFullscreen||el.webkitRequestFullscreen)?.call(el);
    else (document.exitFullscreen||document.webkitExitFullscreen)?.call(document);};

  document.addEventListener('keydown',e=>{
    if(lb.classList.contains('open')){if(e.key==='Escape')lbClose();else if(e.key==='ArrowRight')lbGo(1);else if(e.key==='ArrowLeft')lbGo(-1);return;}
    if(ov.classList.contains('open')){if(e.key==='Escape')ov.classList.remove('open');return;}
    if(e.key==='Escape'){setNav(false);return;}
    if(posterActive){if(e.key==='ArrowRight')pNext();else if(e.key==='ArrowLeft')pPrev();else if(e.key===' '){e.preventDefault();pPlaying=!pPlaying;pRestart();}}
    else{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();deckGo(1);}else if(e.key==='ArrowLeft')deckGo(-1);}
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pStop();else if(pPlaying&&posterActive&&!pHold)pRestart();});

    {b:"Attention levels, never diagnosis",span:"No condition fields, no scores; safety info is written as staff instructions. Medication is a reminder log."},
    {b:"Each channel sees exactly its share",span:"Family: no health data. Volunteers: only assigned work. Station resets after 45s. Province: aggregates only."},
    {b:"One door into the data",span:"Apps go through the gateway with per-user sessions — access is decided by the core system."}
  ];
  const NAMEVI={"Intro":"Giới thiệu","Numbers":T.vi.numbers,"Where it runs":T.vi.whereRuns,"Partners":T.vi.partnersKick,"Print":T.vi.printKick,"Manuals":T.vi.manualsKick,"Principles":"Nguyên tắc"};
  let LANG='en'; try{LANG=localStorage.getItem('clbLang')||'en';}catch(e){}
  function tc(en,vi){return (LANG==='vi'&&vi!=null&&vi!=='')?vi:en;}
  function L(en,key){return (LANG==='vi'&&T.vi&&T.vi[key]!=null)?T.vi[key]:en;}
  function vch(id){return (LANG==='vi'&&VI.chapters&&VI.chapters[id])?VI.chapters[id]:{};}
  function cn(name,id){if(LANG!=='vi')return name;if(id&&VI.chapters&&VI.chapters[id])return VI.chapters[id].kick;return NAMEVI[name]||name;}

  /* ==================== count-up for stats ==================== */
  function animateStats(){
    const nums=deck.querySelectorAll('.stat-num');
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    nums.forEach(el=>{const target=parseFloat(el.dataset.target)||0,suffix=el.dataset.suffix||'';
      if(reduce){el.textContent=target+suffix;return;}
      const dur=900,start=performance.now();
      (function tick(now){const p=Math.min(1,(now-start)/dur),e=1-Math.pow(1-p,3);
        el.textContent=Math.round(e*target)+suffix;if(p<1)requestAnimationFrame(tick);})(performance.now());});
  }

  /* ==================== deep-linking (hash → step) ==================== */
  function updateHash(){try{history.replaceState(null,'','#s'+deckIdx);}catch(e){}}
  function fromHash(){const m=(location.hash||'').match(/^#s(\d+)$/);if(m){const i=+m[1];if(i>=0&&i<STEPS.length){if(posterActive)switchTab('app');deckJump(i);return true;}}return false;}
  window.addEventListener('hashchange',()=>{if(!posterActive)fromHash();});

  /* ==================== deck auto-advance (App slides itself) ==================== */
  let deckAuto=true,deckTimer=null,DECK_MS=8500;
  try{deckAuto=localStorage.getItem('clbDeckAuto')!=='0';}catch(e){}
  const dkProg=document.getElementById('dk-prog'),dkPlay=document.getElementById('dk-play');
  const IC_PLAY2='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const IC_PAUSE2='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  function modalOpen(){return lb.classList.contains('open')||ov.classList.contains('open')||pdfv.classList.contains('open');}
  function stepMs(){ var s=STEPS[deckIdx]; return (s&&s.type!=='screen')?Math.round(DECK_MS*1.5):DECK_MS; }
  function runProg(ms){ if(!dkProg)return; dkProg.style.transition='none'; dkProg.style.width='0%';
    if(deckAuto&&!posterActive&&!modalOpen()){ requestAnimationFrame(()=>{ dkProg.style.transition='width '+ms+'ms linear'; dkProg.style.width='100%'; }); } }
  function deckSchedule(){ clearTimeout(deckTimer);
    if(deckAuto&&!posterActive){ document.body.classList.add('autoplaying'); var ms=stepMs(); runProg(ms);
      deckTimer=setTimeout(function(){ if(document.hidden||modalOpen()){deckSchedule();return;} deckJump(deckIdx>=STEPS.length-1?0:deckIdx+1); },ms);
    } else { document.body.classList.remove('autoplaying'); if(dkProg){dkProg.style.transition='none';dkProg.style.width='0%';} }
  }
  function deckIdle(){ deckSchedule(); } /* any interaction restarts the per-step timer */
  ['pointerdown','keydown','wheel','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{ if(!posterActive)deckSchedule(); },{passive:true}));
  function updatePlay(){ if(dkPlay)dkPlay.innerHTML=deckAuto?IC_PAUSE2:IC_PLAY2; }
  if(dkPlay)dkPlay.onclick=()=>{ deckAuto=!deckAuto; try{localStorage.setItem('clbDeckAuto',deckAuto?'1':'0');}catch(e){} updatePlay(); deckSchedule(); };

  /* ==================== wake lock (keep screen on) ==================== */
  let wakeLock=null;
  async function reqWake(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}}
  reqWake();document.addEventListener('visibilitychange',()=>{if(!document.hidden)reqWake();});

  /* ==================== inline PDF viewer (same-origin books) ==================== */
  const pdfv=document.getElementById('pdfview'),pvFrame=document.getElementById('pv-frame'),pvTitle=document.getElementById('pv-title');
  document.addEventListener('click',e=>{const a=e.target.closest('.lcard');if(!a)return;const href=a.getAttribute('href');
    if(href&&href.indexOf('assets/')===0){e.preventDefault();pvTitle.textContent=(a.querySelector('h4')&&a.querySelector('h4').textContent)||'PDF';pvFrame.src=href;pdfv.classList.add('open');}});
  function pdfClose(){pdfv.classList.remove('open');pvFrame.src='about:blank';}
  document.getElementById('pv-x').onclick=pdfClose;
  pdfv.addEventListener('click',e=>{if(e.target===pdfv)pdfClose();});

  /* ==================== search in overview ==================== */
  const ovSearch=document.getElementById('ov-search'),ovResults=document.getElementById('ov-results');
  const searchIdx=STEPS.map((s,i)=>({i,s})).filter(o=>o.s.type==='screen').map(o=>({i:o.i,ch:o.s.chapter,chId:o.s.chId,cap:o.s.cap,file:o.s.file}));
  function renderSearch(q){q=(q||'').trim().toLowerCase();if(!q){ovResults.innerHTML='';ovGrid.style.display='';return;}ovGrid.style.display='none';
    const hits=searchIdx.filter(o=>o.cap.toLowerCase().indexOf(q)>=0||o.ch.toLowerCase().indexOf(q)>=0||((VI.caps[o.file]||'').toLowerCase().indexOf(q)>=0)).slice(0,14);
    ovResults.innerHTML=hits.length?hits.map(o=>'<div class="ov-res" data-i="'+o.i+'"><div class="r-ch">'+cn(o.ch,o.chId)+'</div><div class="r-cap">'+esc(tc(o.cap,VI.caps[o.file]))+'</div></div>').join(''):'<div style="text-align:center;color:var(--muted);padding:20px">—</div>';
    ovResults.querySelectorAll('.ov-res').forEach(r=>r.onclick=()=>{deckJump(+r.dataset.i);ov.classList.remove('open');ovSearch.value='';renderSearch('');});}
  ovSearch.addEventListener('input',()=>renderSearch(ovSearch.value));

  /* ==================== language toggle ==================== */
  const langBtn=document.getElementById('langBtn');
  function applyLang(){
    document.documentElement.lang=(LANG==='vi'?'vi':'en');
    langBtn.innerHTML=LANG==='vi'?'EN · <b>VI</b>':'<b>EN</b> · VI';
    const os=document.querySelector('#dk-ov span');if(os)os.textContent=L('Overview','overview');
    const ot=document.getElementById('ov-title');if(ot)ot.textContent=LANG==='vi'?T.vi.ovTitle:'Overview — jump to a section';
    if(ovSearch)ovSearch.placeholder=L('Search screens…','search');
    if(typeof updateDlBtn==='function')updateDlBtn();
    if(typeof dlbApplyLang==='function')dlbApplyLang();
    if(typeof settingsApplyLang==='function')settingsApplyLang();
    buildOverview();if(!posterActive)renderDeck();
  }
  langBtn.onclick=()=>{LANG=(LANG==='vi'?'en':'vi');try{localStorage.setItem('clbLang',LANG);}catch(e){}applyLang();};

  /* ==================== offline mode (download-first PWA) ==================== */
  const offToast=document.getElementById('offtoast'),offTxt=document.getElementById('offtoast-txt');
  const offMsg={saving:{en:'Saving for offline…',vi:'Đang lưu để dùng ngoại tuyến…'},ready:{en:'Ready — works offline ✓',vi:'Đã sẵn sàng — dùng ngoại tuyến ✓'},off:{en:'Offline — kiosk still running',vi:'Ngoại tuyến — kiosk vẫn chạy'}};
  function om(k){return offMsg[k][LANG==='vi'?'vi':'en'];}
  let offToastT=null,showedSaving=false;
  function showOff(txt,ready,hideMs){ if(!offToast)return; offTxt.textContent=txt; offToast.classList.toggle('ready',!!ready); offToast.classList.add('show');
    clearTimeout(offToastT); if(hideMs)offToastT=setTimeout(()=>offToast.classList.remove('show'),hideMs); }
  const offBar=document.querySelector('#offtoast-bar i'),dlBtn=document.getElementById('dlBtn');
  function dlLabel(saved){var t=saved?(LANG==='vi'?'Đã lưu offline':'Saved offline'):(LANG==='vi'?'Lưu offline':'Save offline');
    var ic=saved?'<path d="M20 6 9 17l-5-5"/>':'<path d="M12 3v12m0 0 4-4m-4 4-4-4M4 21h16"/>';
    return '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px">'+ic+'</svg> '+t;}
  function updateDlBtn(){ let saved=false; try{saved=localStorage.getItem('clbOffline')==='1';}catch(e){} if(dlBtn){dlBtn.innerHTML=dlLabel(saved);dlBtn.classList.toggle('saved',saved);} }
  /* first-run save-for-offline banner */
  const dlb=document.getElementById('dlbanner'),dlbTitle=document.getElementById('dlb-title'),dlbSub=document.getElementById('dlb-sub'),dlbBar=document.querySelector('#dlbanner .dlb-bar i'),dlbGo=document.getElementById('dlb-go'),dlbX=document.getElementById('dlb-x');
  const bMsg={title:{en:'Save for offline',vi:'Lưu để dùng ngoại tuyến'},sub:{en:'Use with no internet',vi:'Dùng khi không có mạng'},go:{en:'Save',vi:'Lưu'},saving:{en:'Saving…',vi:'Đang lưu…'},ready:{en:'Ready — works offline ✓',vi:'Sẵn sàng — dùng ngoại tuyến ✓'}};
  function bm(k){return bMsg[k][LANG==='vi'?'vi':'en'];}
  function dlbApplyLang(){ if(!dlb)return; if(!dlb.classList.contains('busy')){dlbTitle.textContent=bm('title');dlbSub.textContent=bm('sub');} if(dlbGo)dlbGo.textContent=bm('go'); }
  function dlbHide(){ if(dlb)dlb.classList.remove('show'); }
  function dlbShow(){ if(!dlb)return; let saved=false,dis=false; try{saved=localStorage.getItem('clbOffline')==='1';dis=localStorage.getItem('clbOfflineDismiss')==='1';}catch(e){} if(saved||dis)return; dlbApplyLang(); dlb.classList.add('show'); }
  if(dlbGo)dlbGo.onclick=()=>{ dlb.classList.add('busy'); dlbTitle.textContent=bm('saving'); dlbSub.textContent='0%'; downloadOffline(); };
  if(dlbX)dlbX.onclick=()=>{ dlbHide(); try{localStorage.setItem('clbOfflineDismiss','1');}catch(e){} };
  function showOffProgress(pct){
    if(dlb&&dlb.classList.contains('busy')){ dlbTitle.textContent=bm('saving'); dlbSub.textContent=pct+'%'; if(dlbBar)dlbBar.style.width=pct+'%'; return; }
    if(!offToast)return; offToast.classList.add('show','downloading'); offToast.classList.remove('ready'); offTxt.textContent=om('saving')+' '+pct+'%'; if(offBar)offBar.style.width=pct+'%'; }
  function markOfflineReady(){ try{localStorage.setItem('clbOffline','1');}catch(e){} updateDlBtn();
    if(dlb&&dlb.classList.contains('show')){ dlb.classList.remove('busy'); dlbTitle.textContent=bm('ready'); dlbSub.textContent=''; if(dlbBar)dlbBar.style.width='100%'; setTimeout(dlbHide,1900); if(offToast)offToast.classList.remove('show','downloading'); showedSaving=false; return; }
    if(offToast)offToast.classList.remove('downloading'); if(showedSaving){showOff(om('ready'),true,3600);showedSaving=false;} }
  function downloadOffline(){ if(!('serviceWorker' in navigator))return; showedSaving=true; showOffProgress(0);
    navigator.serviceWorker.ready.then(reg=>{ const w=reg.active||navigator.serviceWorker.controller; if(w)w.postMessage({type:'cache-all'}); }).catch(()=>{}); }
  if(dlBtn)dlBtn.onclick=downloadOffline;
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    let savedOffline=false; try{savedOffline=localStorage.getItem('clbOffline')==='1';}catch(e){}
    navigator.serviceWorker.addEventListener('message',e=>{ const d=e.data||{};
      if(d.type==='cache-progress'){ showOffProgress(Math.round(d.done/d.total*100)); }
      else if(d.type==='offline-ready'){ markOfflineReady(); } });
    window.addEventListener('load',()=>{
      if(!savedOffline){ dlbShow(); }
      navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(()=>{
        const w=navigator.serviceWorker.controller; if(w)w.postMessage({type:'offline-check'});
      }).catch(()=>{ if(showedSaving&&offToast)offToast.classList.remove('show'); });
    });
  }
  updateDlBtn();
  function setOnline(){ document.body.classList.toggle('offline',!navigator.onLine);
    const p=document.getElementById('offpill-txt'); if(p)p.textContent=om('off'); }
  window.addEventListener('online',setOnline); window.addEventListener('offline',setOnline); setOnline();

  /* ==================== background music (poster) ==================== */
  const bgm=document.getElementById('bgm'),sndBtn=document.getElementById('sndBtn');
  let bgmMuted=false; try{bgmMuted=localStorage.getItem('clbMuted')==='1';}catch(e){}
  let userGesture=false;
  const IC_SND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.8 5.5a9 9 0 0 1 0 13"/></svg>';
  const IC_MUTE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>';
  let _fadeT=null;
  function fadeAudio(target){ if(!bgm)return; clearInterval(_fadeT); const step=(target-bgm.volume)/12; let k=0;
    _fadeT=setInterval(()=>{ k++; bgm.volume=Math.max(0,Math.min(1,bgm.volume+step)); if(k>=12){bgm.volume=Math.max(0,Math.min(1,target)); clearInterval(_fadeT); if(target<=0)bgm.pause();} },40); }
  function updateBGM(){ if(!bgm)return; sndBtn.innerHTML=bgmMuted?IC_MUTE:IC_SND;
    const shouldPlay=!bgmMuted&&userGesture&&posterActive&&!document.hidden;
    if(shouldPlay){ if(bgm.paused){bgm.volume=0;bgm.play().then(()=>fadeAudio(0.55)).catch(()=>{});} else fadeAudio(0.55); }
    else { if(!bgm.paused)fadeAudio(0); } }
  sndBtn.onclick=()=>{ bgmMuted=!bgmMuted; try{localStorage.setItem('clbMuted',bgmMuted?'1':'0');}catch(e){} if(!bgmMuted)userGesture=true; updateBGM(); };
  document.addEventListener('pointerdown',()=>{ if(!userGesture){userGesture=true; updateBGM();} },{once:true});
  document.addEventListener('visibilitychange',()=>{updateBGM();if(!document.hidden&&!posterActive)deckSchedule();});

  /* ==================== settings panel ==================== */
  const setEl=document.getElementById('settings'),setBtn=document.getElementById('setBtn');
  let animOn=true; try{animOn=localStorage.getItem('clbAnim')!=='0';}catch(e){}
  let fillOn=false; try{fillOn=localStorage.getItem('clbFill')==='1';}catch(e){}
  try{var _sp=parseInt(localStorage.getItem('clbSpeed'),10); if(_sp>=2000&&_sp<=60000)DECK_MS=_sp;}catch(e){}
  document.body.classList.toggle('noanim',!animOn);
  document.body.classList.toggle('poster-fill',fillOn);
  const setTxt={title:{en:'Settings',vi:'Cài đặt'},lang:{en:'Language',vi:'Ngôn ngữ'},auto:{en:'Auto-play',vi:'Tự động chạy'},speed:{en:'Speed',vi:'Tốc độ'},anim:{en:'Page animation',vi:'Hiệu ứng lật trang'},music:{en:'Music',vi:'Nhạc nền'},fill:{en:'Fill screen (kiosk)',vi:'Lấp đầy màn hình (kiosk)'},off:{en:'Offline',vi:'Ngoại tuyến'},save:{en:'Save offline',vi:'Lưu offline'},saved:{en:'Saved ✓',vi:'Đã lưu ✓'}};
  function st(k){return setTxt[k][LANG==='vi'?'vi':'en'];}
  function setToggle(id,on){var b=document.getElementById(id);if(b)b.classList.toggle('on',!!on);}
  function setSeg(wrapId,val){var w=document.getElementById(wrapId);if(!w)return;w.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===String(val));});}
  function reflectSettings(){ setSeg('set-lang',LANG); setToggle('set-auto',deckAuto); setSeg('set-speed',DECK_MS); setToggle('set-anim',animOn); setToggle('set-music',!bgmMuted); setToggle('set-fill',fillOn);
    var saved=false;try{saved=localStorage.getItem('clbOffline')==='1';}catch(e){} var ob=document.getElementById('set-offline'); if(ob){ob.textContent=saved?st('saved'):st('save');ob.classList.toggle('saved',saved);} }
  function settingsApplyLang(){ document.getElementById('set-title').textContent=st('title'); document.getElementById('set-lang-l').textContent=st('lang'); document.getElementById('set-auto-l').textContent=st('auto'); document.getElementById('set-speed-l').textContent=st('speed'); document.getElementById('set-anim-l').textContent=st('anim'); document.getElementById('set-music-l').textContent=st('music'); document.getElementById('set-fill-l').textContent=st('fill'); document.getElementById('set-off-l').textContent=st('off'); reflectSettings(); }
  function openSettings(){ settingsApplyLang(); setEl.classList.add('open'); }
  function closeSettings(){ setEl.classList.remove('open'); }
  if(setBtn)setBtn.onclick=openSettings;
  document.getElementById('set-x').onclick=closeSettings;
  setEl.addEventListener('click',function(e){if(e.target===setEl)closeSettings();});
  document.getElementById('set-lang').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;LANG=b.dataset.v;try{localStorage.setItem('clbLang',LANG);}catch(_){} applyLang();});
  document.getElementById('set-auto').onclick=function(){deckAuto=!deckAuto;try{localStorage.setItem('clbDeckAuto',deckAuto?'1':'0');}catch(_){} if(typeof updatePlay==='function')updatePlay(); deckSchedule(); reflectSettings();};
  document.getElementById('set-speed').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;DECK_MS=parseInt(b.dataset.v,10);try{localStorage.setItem('clbSpeed',String(DECK_MS));}catch(_){} deckSchedule(); reflectSettings();});
  document.getElementById('set-anim').onclick=function(){animOn=!animOn;try{localStorage.setItem('clbAnim',animOn?'1':'0');}catch(_){} document.body.classList.toggle('noanim',!animOn); reflectSettings();};
  document.getElementById('set-music').onclick=function(){bgmMuted=!bgmMuted;try{localStorage.setItem('clbMuted',bgmMuted?'1':'0');}catch(_){} if(!bgmMuted)userGesture=true; updateBGM(); reflectSettings();};
  document.getElementById('set-fill').onclick=function(){fillOn=!fillOn;try{localStorage.setItem('clbFill',fillOn?'1':'0');}catch(_){} document.body.classList.toggle('poster-fill',fillOn); reflectSettings();};
  document.getElementById('set-offline').onclick=function(){ if(typeof downloadOffline==='function')downloadOffline(); };

  /* ==================== enhancements: haptics, lightbox gestures, idle-home, URL config ==================== */
  function hap(){try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}}

  /* lightbox: swipe left/right between shots, swipe down to close */
  let _lbX=null,_lbY=null;
  lb.addEventListener('touchstart',e=>{_lbX=e.changedTouches[0].clientX;_lbY=e.changedTouches[0].clientY;},{passive:true});
  lb.addEventListener('touchend',e=>{if(_lbX==null)return;const dx=e.changedTouches[0].clientX-_lbX,dy=e.changedTouches[0].clientY-_lbY;
    if(Math.abs(dy)>80&&Math.abs(dy)>Math.abs(dx))lbClose();else if(Math.abs(dx)>45)dx<0?lbGo(1):lbGo(-1);_lbX=null;},{passive:true});

  /* idle → return to the Poster (booth self-reset after 3 min untouched) */
  let homeT=null;const HOME_MS=180000;
  function resetHome(){clearTimeout(homeT);homeT=setTimeout(()=>{if(!posterActive){switchTab('poster');deckJump(0);}},HOME_MS);}
  ['pointerdown','keydown','touchstart','wheel'].forEach(ev=>document.addEventListener(ev,resetHome,{passive:true}));

  /* URL config for per-kiosk setup: ?lang=vi ?tab=app ?auto=0 ?speed=6000 ?kiosk=1 */
  (function(){var P=new URLSearchParams(location.search);
    var lg=P.get('lang'); if(lg==='vi'||lg==='en'){LANG=lg;try{localStorage.setItem('clbLang',LANG);}catch(e){}}
    if(P.get('auto')==='0'){deckAuto=false;try{localStorage.setItem('clbDeckAuto','0');}catch(e){}}
    var sp=parseInt(P.get('speed'),10); if(sp>=2000&&sp<=60000)DECK_MS=sp;
    if(P.get('kiosk')==='1'){ fillOn=true; document.body.classList.add('poster-fill');
      document.addEventListener('pointerdown',function(){var el=document.documentElement,rf=el.requestFullscreen||el.webkitRequestFullscreen;if(rf)try{rf.call(el);}catch(e){}},{once:true});}
    if(P.get('fill')==='1'){fillOn=true;document.body.classList.add('poster-fill');} else if(P.get('fill')==='0'){fillOn=false;document.body.classList.remove('poster-fill');}
    if(P.get('tab')==='app'){switchTab('app');}
  })();

  /* ==================== keyboard a11y ==================== */
  document.getElementById('dk-ov').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ov.classList.add('open');}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pdfv.classList.contains('open'))pdfClose();});

  /* ==================== init ==================== */
  applyLang();
  updateBGM();
  updatePlay();
  if(!fromHash()){/* stay on poster */}
  deckIdle();

  /* warm every image (fetch + decode) when idle → instant, jank-free transitions */
  (function(){ var idle=window.requestIdleCallback||function(f){return setTimeout(f,400);};
    idle(function(){ try{
      shots.forEach(function(sh){ var im=new Image(); im.src=sh.file; if(im.decode)im.decode().catch(function(){}); });
      POSTERS.forEach(function(p){ var im=new Image(); im.src=p; if(im.decode)im.decode().catch(function(){}); });
    }catch(e){} }); })();
  </script>
